<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso | Voluntariados & Hoteles</title>
  <!--estilos-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="login.css">
  <link rel="shortcut icon" href="./fotos/logo.jpg" type="image/x-icon">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="inicio.html" class="logo-link">
        <img src="./fotos/logo.jpg" alt="LOGO" class="logo" />
      </a>

      <nav class="main-nav" aria-label="Menú principal">
        <a href="register.html" class="nav-link">REGÍSTRATE</a>
        <a href="inicio.html" class="nav-link">INICIO</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div class="login-box">
      <!-- LOGO  -->

      <h2>Bienvenido</h2>

      <form>
        <label>Correo electrónico</label>
        <input type="email" placeholder="correo@ejemplo.com" required>

        <label>Contraseña</label>
        <input type="password" placeholder="••••••••" required>
         <label for="filtro" style ="margin-bottom: 15px 15px;font-weight: bold; padding: 10px 15px;
            background-color: #7cb9fa;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px 15px;">Aporte:</label>
      <select id="filtro" aria-label="Filtrar por ubicación">
        <option value="busqueda">BUSCAR HOSPEDAJE</option>
        <option value="op_laboral">BUSCAR OP. LABORAL</option>
      </select>

        <button type="button" id="iniciar-sesion">Iniciar Sesion</button>
      </form>

      <div class="links">
        <a href="forgot.html">¿Olvidaste tu contraseña?</a>
        <a href="register.html">Crear cuenta</a>
      </div>
    </div>
  </div>

  <footer id="footer">
    <div style="text-align: center; color: lab(85.35% -31.59 -14.78); text-decoration: underline; text-decoration-color: #ef96f7;">Contáctanos</div>
    <p> Si tienes alguna pregunta o necesitas más información, no dudes en contactarnos. KINDNEST PRO siempre está aquí para ayudarte.</p>
    <div class="social-icons" aria-label="Redes sociales">
      <a href="https://www.whatsapp.com/?lang=es" aria-label="WhatsApp"><i class="fa-brands fa-whatsapp" style="color: #5af280;"></i></a>
      <a href="https://www.instagram.com/" aria-label="Instagram"><i class="fa-brands fa-square-instagram" style="color: #f27dc7;"></i></a>
      <a href="https://www.facebook.com/" aria-label="Facebook"><i class="fa-brands fa-facebook" style="color: #74C0FC;"></i></a>
      <a href="https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&dsh=S-433904788%3A1762739809103135&ec=asw-gmail-globalnav-signin&flowEntry=AccountChooser&flowName=GlifWebSignIn&service=mail" aria-label="EMAIL"><i class="fa-regular fa-envelope" style="color: #bc2929;"></i></a>
    </div>
    <p>&copy; 2025 Plataforma de Voluntariados. Todos los derechos reservados.</p>
  </footer>
  <script>
        document.getElementById('iniciar-sesion').addEventListener('click', function() {
            const seleccion = document.getElementById('filtro').value;
            if (seleccion === 'busqueda') {
                window.location.href = 'hospedajes.html';
            } else if (seleccion === 'op_laboral') {
                window.location.href = 'trabajos.html';
            }
        });
    </script>
</body>
</html>
